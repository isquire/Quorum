{% if checked_in_name is defined and checked_in_name %}
<div class="toast-checkin" role="alert">&#10003; {{ checked_in_name }} checked in</div>
{% endif %}

<div class="row g-2">
  {% for a in attendees %}
  {% if a.user %}
  <div class="col-sm-6 col-md-4 col-lg-3">
    {% if a.is_present %}
    <div class="attendee-card checked-in d-flex align-items-center justify-content-between">
      <span>{{ a.user.full_name }}</span>
      <span class="fw-bold">&#10003;</span>
    </div>
    {% else %}
    <form hx-post="{{ url_for('kiosk.checkin', token=token, user_id=a.user.id) }}"
          hx-target="#attendee-list"
          hx-swap="innerHTML">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="attendee-card">
        {{ a.user.full_name }}
      </button>
    </form>
    {% endif %}
  </div>
  {% endif %}
  {% else %}
  <div class="col-12">
    <p class="text-muted text-center py-4">No matching attendees found.</p>
  </div>
  {% endfor %}
</div>

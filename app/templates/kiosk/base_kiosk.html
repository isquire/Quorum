<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Check-In{% endblock %} · {{ app_name }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body { background: #f5f6fa; min-height: 100vh; }
    .kiosk-header { background: #212529; color: #fff; padding: .75rem 1rem; }
    .kiosk-search { font-size: 1.25rem; padding: .75rem 1rem; }
    .letter-bar .btn { min-width: 2.5rem; font-weight: 600; }
    .attendee-card {
      cursor: pointer;
      font-size: 1.1rem;
      padding: .75rem 1rem;
      border-radius: .5rem;
      transition: background .15s;
      user-select: none;
    }
    .attendee-card:hover { background: #e9ecef; }
    .attendee-card.checked-in {
      background: #d1e7dd;
      color: #0f5132;
      cursor: default;
    }
    .toast-checkin {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      font-size: 1.5rem;
      padding: 2rem 3rem;
      border-radius: 1rem;
      background: #198754;
      color: #fff;
      box-shadow: 0 .5rem 2rem rgba(0,0,0,.25);
      animation: fadeOut 2s 1s forwards;
    }
    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }
  </style>
</head>
<body>
  {% block body %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
